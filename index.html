<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoForge — Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080810;--bg2:#0e0e1a;--bg3:#13131f;--surface:#1a1a28;--surface2:#222235;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --accent:#7c5cfc;--accent2:#a78bfa;--accent3:#c4b5fd;
  --pink:#f472b6;--cyan:#22d3ee;--gold:#fbbf24;
  --text:#f0eeff;--text2:#a09abe;--text3:#5e5c7a;--success:#4ade80;
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Syne',sans-serif;}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4;}

.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:orbFloat 8s ease-in-out infinite alternate;}
.orb1{width:400px;height:400px;top:-100px;left:-100px;background:rgba(124,92,252,0.12);}
.orb2{width:300px;height:300px;top:60%;right:-80px;background:rgba(244,114,182,0.08);animation-delay:3s;}
.orb3{width:250px;height:250px;bottom:10%;left:30%;background:rgba(34,211,238,0.07);animation-delay:5s;}
@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(20px,20px) scale(1.1)}}

nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,16,0.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:12px;color:var(--text3);margin-top:1px;font-family:'DM Sans',sans-serif;font-weight:400;letter-spacing:0;}

.btn{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:9px 20px;border-radius:var(--radius-xs);border:none;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--surface);color:var(--text);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 20px rgba(124,92,252,0.35);}
.btn-primary:hover{background:#6d4fe0;transform:translateY(-1px);box-shadow:0 6px 28px rgba(124,92,252,0.5);}
.btn-sm{padding:6px 14px;font-size:13px;}
.btn-danger{background:rgba(244,114,182,0.12);color:var(--pink);border:1px solid rgba(244,114,182,0.25);}
.btn-danger:hover{background:rgba(244,114,182,0.2);}

main{padding-top:80px;position:relative;z-index:1;}

/* Hero / Profile */
.hero{padding:64px 40px 48px;max-width:1000px;margin:0 auto;animation:fadeUp 0.7s ease both;}
.profile-bar{display:flex;align-items:flex-start;gap:28px;margin-bottom:40px;}
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:32px;font-weight:700;color:var(--text3);overflow:hidden;cursor:pointer;transition:var(--transition);}
.avatar:hover{border-color:rgba(124,92,252,0.5);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-edit{position:absolute;bottom:2px;right:2px;width:24px;height:24px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);}
.avatar-edit:hover{transform:scale(1.15);}
.profile-info{flex:1;}
.profile-name{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;}
.profile-name:hover .edit-hint{opacity:1;}
.edit-hint{font-size:12px;color:var(--accent2);font-weight:400;letter-spacing:0;opacity:0;transition:var(--transition);}
.profile-bio{color:var(--text2);font-size:15px;line-height:1.6;max-width:560px;cursor:pointer;}
.profile-bio:hover{color:var(--text);}
.profile-placeholder{color:var(--text3);font-style:italic;}
.stats-row{display:flex;gap:32px;margin-top:20px;}
.stat{text-align:center;}
.stat-num{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;}
.stat-label{font-size:12px;color:var(--text3);margin-top:3px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* Section */
.portfolio-section{padding:0 32px 80px;max-width:1400px;margin:0 auto;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.section-title{font-size:20px;font-weight:700;}
.filter-tabs{display:flex;gap:4px;background:var(--surface);border-radius:var(--radius-xs);padding:4px;}
.filter-tab{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text2);background:transparent;transition:var(--transition);}
.filter-tab.active{background:var(--surface2);color:var(--text);}
.filter-tab:hover:not(.active){color:var(--text);}

/* Grid */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;}

/* Empty state */
.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 40px;text-align:center;}
.empty-icon-wrap{width:96px;height:96px;border-radius:24px;background:var(--surface);border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pulse 3s ease infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,252,0)}50%{box-shadow:0 0 0 12px rgba(124,92,252,0.06)}}
.empty-state h3{font-size:20px;font-weight:700;margin-bottom:10px;}
.empty-state p{color:var(--text3);font-size:14px;margin-bottom:28px;max-width:320px;line-height:1.7;}

/* Card */
.video-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:var(--transition);animation:fadeUp 0.5s ease both;position:relative;}
.video-card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 0 1px rgba(124,92,252,0.1);}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg3);}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);}
.video-card:hover .thumb img{transform:scale(1.05);}
.thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text3);font-size:13px;}
.thumb-ph svg{opacity:0.3;transition:var(--transition);}
.video-card:hover .thumb-ph svg{opacity:0.55;transform:scale(1.08);}
.thumb-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:var(--transition);}
.video-card:hover .thumb-overlay{opacity:1;}
.play-btn{width:56px;height:56px;border-radius:50%;background:rgba(124,92,252,0.9);display:flex;align-items:center;justify-content:center;transform:scale(0.7);transition:var(--transition);box-shadow:0 0 28px rgba(124,92,252,0.5);}
.video-card:hover .play-btn{transform:scale(1);}
.play-btn svg{margin-left:3px;}
.thumb-badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;}
.badge{padding:3px 9px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:0.5px;backdrop-filter:blur(8px);text-transform:uppercase;}
.badge-private{background:rgba(244,114,182,0.2);color:var(--pink);border:1px solid rgba(244,114,182,0.3);}
.badge-public{background:rgba(74,222,128,0.2);color:var(--success);border:1px solid rgba(74,222,128,0.3);}
.badge-dur{background:rgba(0,0,0,0.65);color:var(--text);border:1px solid rgba(255,255,255,0.1);position:absolute;bottom:10px;right:10px;}

.card-body{padding:18px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;line-height:1.35;flex:1;margin-right:10px;}
.card-menu{position:relative;}
.menu-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:var(--transition);flex-shrink:0;}
.menu-btn:hover{background:var(--surface2);color:var(--text);}
.dropdown{position:absolute;right:0;top:36px;z-index:50;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:5px;min-width:155px;box-shadow:0 16px 40px rgba(0,0,0,0.45);opacity:0;transform:translateY(-8px) scale(0.95);pointer-events:none;transition:var(--transition);transform-origin:top right;}
.dropdown.open{opacity:1;transform:none;pointer-events:auto;}
.di{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);transition:var(--transition);border:none;background:transparent;width:100%;text-align:left;}
.di:hover{background:var(--surface);color:var(--text);}
.di.danger:hover{color:var(--pink);}
.dd-sep{height:1px;background:var(--border);margin:4px 0;}

.card-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tech-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.tech-tag{padding:3px 9px;border-radius:100px;font-size:11px;font-weight:500;background:rgba(124,92,252,0.1);color:var(--accent2);border:1px solid rgba(124,92,252,0.18);}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:13px;border-top:1px solid var(--border);}
.meta-row{display:flex;align-items:center;gap:12px;}
.meta-item{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);}
.stars{display:flex;gap:1px;}
.star{font-size:13px;color:var(--gold);cursor:pointer;transition:var(--transition);}
.star.off{color:var(--text3);}
.star:hover{transform:scale(1.3);}
.card-btns{display:flex;gap:7px;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:var(--transition);}
.icon-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--border2);}
.icon-btn.liked{color:var(--pink);border-color:rgba(244,114,182,0.3);background:rgba(244,114,182,0.08);}

/* Modal */
.backdrop{position:fixed;inset:0;z-index:200;background:rgba(8,8,16,0.93);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:0.3s ease;}
.backdrop.open{opacity:1;pointer-events:auto;}
.modal{background:var(--surface);border-radius:20px;border:1px solid var(--border2);width:100%;max-width:900px;max-height:90vh;overflow-y:auto;transform:translateY(28px) scale(0.97);transition:0.35s cubic-bezier(0.4,0,0.2,1);box-shadow:0 40px 100px rgba(0,0,0,0.65),0 0 0 1px rgba(124,92,252,0.08);}
.backdrop.open .modal{transform:none;}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:100px;}
.modal-video{aspect-ratio:16/9;background:var(--bg);border-radius:20px 20px 0 0;overflow:hidden;position:relative;}
.modal-video video{width:100%;height:100%;object-fit:contain;background:#000;}
.modal-video-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--text2);font-size:15px;background:rgba(8,8,16,0.6);}
.modal-video-ph img.bg-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.3;z-index:0;}
.modal-video-ph>*{position:relative;z-index:1;}
.modal-play{width:76px;height:76px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);box-shadow:0 0 40px rgba(124,92,252,0.45);}
.modal-play:hover{transform:scale(1.1);box-shadow:0 0 60px rgba(124,92,252,0.65);}
.modal-play svg{margin-left:4px;}

.modal-body{padding:30px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.modal-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-0.5px;line-height:1.2;flex:1;margin-right:16px;}
.mclose{width:38px;height:38px;border-radius:9px;border:1px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:var(--transition);flex-shrink:0;}
.mclose:hover{background:var(--surface2);color:var(--text);}
.modal-meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.pi{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 12px;border-radius:100px;}
.pi-pub{background:rgba(74,222,128,0.1);color:var(--success);border:1px solid rgba(74,222,128,0.25);}
.pi-priv{background:rgba(244,114,182,0.1);color:var(--pink);border:1px solid rgba(244,114,182,0.25);}
.modal-acts{display:flex;gap:8px;margin-left:auto;}

/* Rating box */
.rating-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;margin-bottom:22px;}
.rating-label{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:10px;letter-spacing:0.3px;}
.modal-stars{display:flex;gap:5px;}
.mstar{font-size:22px;color:var(--gold);cursor:pointer;transition:var(--transition);}
.mstar.off{color:var(--text3);}
.mstar:hover{transform:scale(1.3);}
.rating-info{font-size:12px;color:var(--text3);margin-top:8px;}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;}
.tab{padding:11px 18px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;transition:var(--transition);}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text2);}
.tab-content{display:none;}
.tab-content.active{display:block;animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Tech chips */
.tech-grid{display:flex;flex-wrap:wrap;gap:9px;}
.tech-chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);font-size:13px;font-weight:500;transition:var(--transition);}
.tech-chip:hover{border-color:rgba(124,92,252,0.3);background:rgba(124,92,252,0.05);}
.tdot{width:8px;height:8px;border-radius:50%;}

/* Comments */
.comment-form{margin-bottom:24px;}
.comment-ta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;resize:vertical;min-height:76px;transition:var(--transition);outline:none;}
.comment-ta:focus{border-color:rgba(124,92,252,0.4);box-shadow:0 0 0 3px rgba(124,92,252,0.08);}
.comment-ta::placeholder{color:var(--text3);}
.cf-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.cc{font-size:12px;color:var(--text3);}
.comments-list{display:flex;flex-direction:column;gap:14px;}
.comment{display:flex;gap:12px;padding:14px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);animation:fadeIn 0.3s ease;transition:var(--transition);}
.comment:hover{border-color:var(--border2);}
.cavatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.cauthor{font-size:13px;font-weight:600;}
.cdate{font-size:11px;color:var(--text3);}
.ctext{font-size:13px;color:var(--text2);line-height:1.6;}
.cacts{display:flex;gap:10px;margin-top:8px;}
.cact{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);cursor:pointer;transition:var(--transition);border:none;background:transparent;}
.cact:hover{color:var(--text2);}
.cact.liked{color:var(--pink);}
.no-comments{text-align:center;padding:36px;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:var(--radius-sm);}

/* Upload modal */
.upload-modal{background:var(--surface);border-radius:20px;border:1px solid var(--border2);width:100%;max-width:660px;transform:translateY(28px) scale(0.97);transition:0.35s cubic-bezier(0.4,0,0.2,1);box-shadow:0 40px 100px rgba(0,0,0,0.65);overflow:hidden;max-height:90vh;overflow-y:auto;}
.upload-modal::-webkit-scrollbar{width:4px;}
.upload-modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:100px;}
.backdrop.open .upload-modal{transform:none;}
.uhead{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--border);}
.utitle{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;}
.ubody{padding:26px;}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:44px 20px;text-align:center;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(124,92,252,0.04);}
.upload-zone p{color:var(--text2);font-size:14px;margin-bottom:5px;}
.upload-zone span{color:var(--text3);font-size:12px;}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.file-selected{display:none;margin-top:10px;padding:11px 13px;background:rgba(124,92,252,0.07);border:1px solid rgba(124,92,252,0.2);border-radius:9px;font-size:13px;align-items:center;gap:9px;color:var(--accent2);}
.progress-wrap{margin-top:10px;height:3px;background:var(--border);border-radius:100px;overflow:hidden;display:none;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));width:0%;transition:width 0.2s ease;border-radius:100px;}

.fg{margin-bottom:18px;}
.fl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:7px;letter-spacing:0.3px;}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:var(--transition);outline:none;}
.fi:focus{border-color:rgba(124,92,252,0.4);box-shadow:0 0 0 3px rgba(124,92,252,0.08);}
.fi::placeholder{color:var(--text3);}
textarea.fi{resize:vertical;min-height:84px;}
.ptoggle{display:flex;gap:7px;}
.pbtn{flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text2);transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:7px;}
.pbtn.ap{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.35);color:var(--success);}
.pbtn.av{background:rgba(244,114,182,0.08);border-color:rgba(244,114,182,0.35);color:var(--pink);}
.tags-inp{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 11px;min-height:42px;cursor:text;transition:var(--transition);}
.tags-inp.foc{border-color:rgba(124,92,252,0.4);box-shadow:0 0 0 3px rgba(124,92,252,0.08);}
.tpill{display:flex;align-items:center;gap:4px;background:rgba(124,92,252,0.14);color:var(--accent2);border:1px solid rgba(124,92,252,0.18);padding:3px 9px;border-radius:100px;font-size:12px;font-weight:500;}
.tremove{cursor:pointer;opacity:0.6;font-size:13px;line-height:1;}
.tremove:hover{opacity:1;}
.tinput{background:transparent;border:none;outline:none;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;flex:1;min-width:80px;}
.ufoot{display:flex;gap:10px;justify-content:flex-end;padding:18px 26px;border-top:1px solid var(--border);}

/* Profile edit inline */
.inline-edit{display:none;width:100%;background:var(--bg3);border:1px solid rgba(124,92,252,0.4);border-radius:var(--radius-sm);padding:9px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:inherit;outline:none;box-shadow:0 0 0 3px rgba(124,92,252,0.08);}
.inline-edit.visible{display:block;}

/* Toast */
.toast{position:fixed;bottom:28px;right:28px;z-index:300;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:13px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 16px 40px rgba(0,0,0,0.4);transform:translateY(18px);opacity:0;transition:0.3s cubic-bezier(0.4,0,0.2,1);font-size:13px;max-width:280px;}
.toast.show{transform:none;opacity:1;}
.ticon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ts .ticon{background:rgba(74,222,128,0.18);color:var(--success);}
.ti .ticon{background:rgba(124,92,252,0.18);color:var(--accent2);}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:100px;}

@media(max-width:700px){
  nav{padding:12px 18px;}
  .hero{padding:52px 18px 36px;}
  .portfolio-section{padding:0 18px 60px;}
  .video-grid{grid-template-columns:1fr;}
  .stats-row{gap:20px;}
  .profile-bar{gap:18px;}
}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<nav>
  <div>
    <div class="logo" id="nav-logo">VideoForge</div>
    <div class="logo-sub" id="nav-sub">portfólio de vídeos</div>
  </div>
  <button class="btn btn-primary" onclick="openUpload()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Adicionar Vídeo
  </button>
</nav>

<main>
  <div class="hero">
    <div class="profile-bar">
      <div class="avatar-wrap">
        <div class="avatar" id="avatar-el" onclick="triggerAvatarUpload()" title="Clique para alterar foto">
          <span id="avatar-initials">?</span>
          <img id="avatar-img" src="" alt="" style="display:none">
        </div>
        <div class="avatar-edit" onclick="triggerAvatarUpload()" title="Alterar foto">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
        <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="loadAvatar(event)">
      </div>
      <div class="profile-info">
        <div class="profile-name" onclick="editName()" title="Clique para editar">
          <span id="profile-name-text" class="profile-placeholder">Seu nome aqui</span>
          <span class="edit-hint">✎ editar</span>
        </div>
        <input class="inline-edit" id="name-input" type="text" placeholder="Seu nome completo" onblur="saveName()" onkeydown="if(event.key==='Enter')saveName()">
        <div id="profile-bio-text" class="profile-bio profile-placeholder" onclick="editBio()" title="Clique para editar">Clique aqui para adicionar uma bio...</div>
        <textarea class="inline-edit" id="bio-input" placeholder="Fale sobre você, sua área, experiência..." rows="3" onblur="saveBio()"></textarea>
        <div class="stats-row">
          <div class="stat"><div class="stat-num" id="st-total">0</div><div class="stat-label">Vídeos</div></div>
          <div class="stat"><div class="stat-num" id="st-pub">0</div><div class="stat-label">Públicos</div></div>
          <div class="stat"><div class="stat-num" id="st-avg">—</div><div class="stat-label">Avaliação</div></div>
          <div class="stat"><div class="stat-num" id="st-views">0</div><div class="stat-label">Visualizações</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="portfolio-section">
    <div class="section-header">
      <h2 class="section-title">Meus Vídeos</h2>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all',this)">Todos</button>
        <button class="filter-tab" onclick="setFilter('public',this)">Públicos</button>
        <button class="filter-tab" onclick="setFilter('private',this)">Privados</button>
      </div>
    </div>
    <div class="video-grid" id="grid"></div>
  </div>
</main>

<!-- View Modal -->
<div class="backdrop" id="view-modal" onclick="bdClick(event,'view-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-video" id="mv-area"></div>
    <div class="modal-body" id="mv-body"></div>
  </div>
</div>

<!-- Upload Modal -->
<div class="backdrop" id="up-modal" onclick="bdClick(event,'up-modal')">
  <div class="upload-modal" onclick="event.stopPropagation()">
    <div class="uhead">
      <h3 class="utitle">Adicionar Vídeo</h3>
      <button class="mclose" onclick="closeModal('up-modal')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="ubody">
      <div class="upload-zone" id="upzone" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
        <div style="margin-bottom:14px;opacity:0.4">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="5" width="22" height="14" rx="2"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
        </div>
        <p>Arraste o arquivo de vídeo ou <strong style="color:var(--accent2)">clique para selecionar</strong></p>
        <span>MP4, MOV, AVI, MKV, WebM — máx. 2 GB</span>
        <input type="file" accept="video/*" id="vid-file" onchange="onFileChange(event)">
      </div>
      <div class="file-selected" id="file-sel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        <span id="file-name"></span>
      </div>
      <div class="progress-wrap" id="prog-wrap"><div class="progress-fill" id="prog-fill"></div></div>

      <div style="margin-top:22px">
        <div class="fg">
          <label class="fl">Título *</label>
          <input type="text" class="fi" id="f-title" placeholder="Nome do vídeo ou projeto">
        </div>
        <div class="fg">
          <label class="fl">Descrição</label>
          <textarea class="fi" id="f-desc" placeholder="Descreva o vídeo, o processo, os objetivos..."></textarea>
        </div>
        <div class="fg">
          <label class="fl">Tecnologias e Ferramentas Utilizadas</label>
          <div class="tags-inp" id="tags-box" onclick="document.getElementById('tag-in').focus()">
            <input type="text" class="tinput" id="tag-in" placeholder="ex: Premiere Pro — pressione Enter" onkeydown="tagKey(event)" onfocus="document.getElementById('tags-box').classList.add('foc')" onblur="document.getElementById('tags-box').classList.remove('foc')">
          </div>
        </div>
        <div class="fg" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label class="fl">Duração</label>
            <input type="text" class="fi" id="f-dur" placeholder="ex: 2:34">
          </div>
          <div>
            <label class="fl">URL da Thumbnail</label>
            <input type="text" class="fi" id="f-thumb" placeholder="https://...">
          </div>
        </div>
        <div class="fg">
          <label class="fl">URL do Vídeo (para reprodução)</label>
          <input type="text" class="fi" id="f-url" placeholder="https://youtube.com/... ou link direto de vídeo">
        </div>
        <div class="fg">
          <label class="fl">Visibilidade</label>
          <div class="ptoggle">
            <button class="pbtn ap" id="btn-pub" onclick="setPriv('public')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              Público
            </button>
            <button class="pbtn" id="btn-priv" onclick="setPriv('private')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Privado
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="ufoot">
      <button class="btn btn-ghost" onclick="closeModal('up-modal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveVideo()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Salvar Vídeo
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div class="ticon" id="ti"></div><span id="tm"></span></div>

<script>
// ── State ──────────────────────────────────────────────
const S = {
  videos: JSON.parse(localStorage.getItem('vf_videos')||'[]'),
  profile: JSON.parse(localStorage.getItem('vf_profile')||'{"name":"","bio":"","avatar":""}'),
  filter: 'all',
  privSel: 'public',
  tags: [],
  curVid: null
};

const TC = ['#7c5cfc','#f472b6','#22d3ee','#fbbf24','#4ade80','#fb923c','#a78bfa','#34d399'];

function save() {
  localStorage.setItem('vf_videos', JSON.stringify(S.videos));
  localStorage.setItem('vf_profile', JSON.stringify(S.profile));
}

// ── Profile ────────────────────────────────────────────
function initProfile() {
  const p = S.profile;
  if(p.name) {
    document.getElementById('profile-name-text').textContent = p.name;
    document.getElementById('profile-name-text').classList.remove('profile-placeholder');
    const initials = p.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('avatar-initials').textContent = initials;
    document.getElementById('nav-logo').textContent = p.name;
  }
  if(p.bio) {
    document.getElementById('profile-bio-text').textContent = p.bio;
    document.getElementById('profile-bio-text').classList.remove('profile-placeholder');
  }
  if(p.avatar) {
    const img = document.getElementById('avatar-img');
    img.src = p.avatar; img.style.display='block';
    document.getElementById('avatar-initials').style.display='none';
  }
}

function editName() {
  const inp = document.getElementById('name-input');
  inp.value = S.profile.name;
  inp.classList.add('visible');
  inp.focus();
  document.getElementById('profile-name-text').style.display='none';
}

function saveName() {
  const val = document.getElementById('name-input').value.trim();
  document.getElementById('name-input').classList.remove('visible');
  document.getElementById('profile-name-text').style.display='';
  if(!val) return;
  S.profile.name = val;
  document.getElementById('profile-name-text').textContent = val;
  document.getElementById('profile-name-text').classList.remove('profile-placeholder');
  const initials = val.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('avatar-initials').textContent = initials;
  document.getElementById('nav-logo').textContent = val;
  save(); toast('Nome atualizado!','s');
}

function editBio() {
  const ta = document.getElementById('bio-input');
  ta.value = S.profile.bio;
  ta.classList.add('visible');
  ta.focus();
  document.getElementById('profile-bio-text').style.display='none';
}

function saveBio() {
  const val = document.getElementById('bio-input').value.trim();
  document.getElementById('bio-input').classList.remove('visible');
  document.getElementById('profile-bio-text').style.display='';
  if(!val) return;
  S.profile.bio = val;
  document.getElementById('profile-bio-text').textContent = val;
  document.getElementById('profile-bio-text').classList.remove('profile-placeholder');
  save(); toast('Bio atualizada!','s');
}

function triggerAvatarUpload() { document.getElementById('avatar-file').click(); }

function loadAvatar(e) {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    S.profile.avatar = ev.target.result;
    const img = document.getElementById('avatar-img');
    img.src = ev.target.result; img.style.display='block';
    document.getElementById('avatar-initials').style.display='none';
    save(); toast('Foto atualizada!','s');
  };
  r.readAsDataURL(f);
}

// ── Stats ──────────────────────────────────────────────
function updateStats() {
  const vs = S.videos;
  const pub = vs.filter(v=>v.privacy==='public');
  const rated = vs.filter(v=>v.ratingCount>0);
  const avg = rated.length ? (rated.reduce((s,v)=>s+v.rating,0)/rated.length).toFixed(1) : '—';
  const views = pub.reduce((s,v)=>s+v.views,0);
  document.getElementById('st-total').textContent = vs.length;
  document.getElementById('st-pub').textContent = pub.length;
  document.getElementById('st-avg').textContent = avg;
  document.getElementById('st-views').textContent = views;
}

// ── Grid ───────────────────────────────────────────────
function render() {
  const grid = document.getElementById('grid');
  const list = S.filter==='all' ? S.videos : S.videos.filter(v=>v.privacy===S.filter);

  if(!list.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon-wrap">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text3)"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </div>
      <h3>${S.filter==='all'?'Nenhum vídeo ainda':'Nenhum vídeo '+(S.filter==='public'?'público':'privado')}</h3>
      <p>${S.filter==='all'?'Adicione seu primeiro vídeo clicando no botão acima. Seu portfólio ficará aqui.':'Altere o filtro ou adicione um novo vídeo.'}</p>
      ${S.filter==='all'?`<button class="btn btn-primary" onclick="openUpload()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar Vídeo
      </button>`:''}
    </div>`;
    updateStats(); return;
  }

  grid.innerHTML = list.map((v,i) => `
    <div class="video-card" style="animation-delay:${i*0.06}s">
      <div class="thumb" onclick="openView(${v.id})">
        ${v.thumb
          ? `<img src="${v.thumb}" alt="${esc(v.title)}" loading="lazy">`
          : `<div class="thumb-ph"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg><span>Sem thumbnail</span></div>`}
        <div class="thumb-overlay"><div class="play-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div>
        <div class="thumb-badges"><span class="badge ${v.privacy==='public'?'badge-public':'badge-private'}">${v.privacy==='public'?'Público':'Privado'}</span></div>
        ${v.duration?`<span class="badge badge-dur">${esc(v.duration)}</span>`:''}
      </div>
      <div class="card-body">
        <div class="card-top">
          <h3 class="card-title" onclick="openView(${v.id})">${esc(v.title)}</h3>
          <div class="card-menu">
            <button class="menu-btn" onclick="event.stopPropagation();toggleDrop(${v.id})">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
            </button>
            <div class="dropdown" id="drop-${v.id}">
              <button class="di" onclick="dlVideo(${v.id})">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Baixar
              </button>
              <button class="di" onclick="flipPrivacy(${v.id})">
                ${v.privacy==='public'
                  ?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Tornar Privado'
                  :'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Tornar Público'}
              </button>
              <div class="dd-sep"></div>
              <button class="di danger" onclick="delVideo(${v.id})">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                Excluir
              </button>
            </div>
          </div>
        </div>
        ${v.desc?`<p class="card-desc">${esc(v.desc)}</p>`:''}
        ${v.tech.length?`<div class="tech-tags">${v.tech.slice(0,4).map(t=>`<span class="tech-tag">${esc(t)}</span>`).join('')}${v.tech.length>4?`<span class="tech-tag">+${v.tech.length-4}</span>`:''}</div>`:''}
        <div class="card-footer">
          <div class="meta-row">
            <div class="stars">${[1,2,3,4,5].map(n=>`<span class="star${n<=v.rating?' ':' off'}" onclick="quickRate(${v.id},${n});event.stopPropagation()">★</span>`).join('')}</div>
            <span class="meta-item">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              ${v.comments.length}
            </span>
          </div>
          <div class="card-btns">
            <button class="icon-btn ${v.liked?'liked':''}" onclick="toggleLike(${v.id});event.stopPropagation()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="${v.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <button class="icon-btn" onclick="dlVideo(${v.id});event.stopPropagation()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
  updateStats();
}

// ── View Modal ─────────────────────────────────────────
function openView(id) {
  const v = S.videos.find(x=>x.id===id);
  if(!v){return;}
  S.curVid = id;
  v.views = (v.views||0) + 1;
  save();

  // Video area
  let videoHTML = '';
  if(v.url) {
    // Try to embed youtube/vimeo or use native video
    const ytMatch = v.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
    const viMatch = v.url.match(/vimeo\.com\/(\d+)/);
    if(ytMatch) {
      videoHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allowfullscreen style="border:none;width:100%;height:100%;"></iframe>`;
    } else if(viMatch) {
      videoHTML = `<iframe width="100%" height="100%" src="https://player.vimeo.com/video/${viMatch[1]}" frameborder="0" allowfullscreen style="border:none;width:100%;height:100%;"></iframe>`;
    } else {
      videoHTML = `<video controls style="width:100%;height:100%;background:#000"><source src="${esc(v.url)}">Seu navegador não suporta vídeo HTML5.</video>`;
    }
  } else {
    videoHTML = `
      ${v.thumb?`<img class="bg-thumb" src="${esc(v.thumb)}" alt="">`:''}
      <div class="modal-play" onclick="toast('Adicione uma URL de vídeo para reproduzir.','i')">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <p style="color:rgba(255,255,255,0.6);font-size:13px">Nenhuma URL de vídeo configurada</p>`;
  }

  document.getElementById('mv-area').innerHTML = videoHTML;
  if(!v.url) document.getElementById('mv-area').querySelector('div.modal-play')||null;

  // Body
  const avgTxt = v.ratingCount>0 ? `${v.ratingCount} avaliação${v.ratingCount!==1?'ões':''} · Média ${v.rating.toFixed(1)}` : 'Sem avaliações ainda';
  document.getElementById('mv-body').innerHTML = `
    <div class="modal-head">
      <h2 class="modal-title">${esc(v.title)}</h2>
      <button class="mclose" onclick="closeModal('view-modal')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-meta-row">
      <span class="pi ${v.privacy==='public'?'pi-pub':'pi-priv'}">
        ${v.privacy==='public'
          ?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Público'
          :'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Privado'}
      </span>
      ${v.duration?`<span style="font-size:12px;color:var(--text3)">⏱ ${esc(v.duration)}</span>`:''}
      <span style="font-size:12px;color:var(--text3)">👁 ${v.views} visualizações</span>
      <div class="modal-acts">
        <button class="btn btn-ghost btn-sm ${v.liked?'liked':''}" onclick="toggleLike(${v.id},true)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="${v.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          ${v.likes}
        </button>
        <button class="btn btn-primary btn-sm" onclick="dlVideo(${v.id})">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Baixar
        </button>
      </div>
    </div>

    <div class="rating-box">
      <div class="rating-label">AVALIE ESTE VÍDEO</div>
      <div class="modal-stars" id="mstars">${[1,2,3,4,5].map(n=>`<span class="mstar${n<=v.rating?' ':' off'}" onmouseover="hoverS(${v.id},${n})" onmouseout="resetS(${v.id})" onclick="doRate(${v.id},${n})">★</span>`).join('')}</div>
      <div class="rating-info" id="rinfo">${avgTxt}</div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="swTab(event,'t-about')">Sobre</button>
      <button class="tab" onclick="swTab(event,'t-tech')">Tecnologias${v.tech.length?` (${v.tech.length})`:''}</button>
      <button class="tab" onclick="swTab(event,'t-comm')">Comentários <span style="background:rgba(124,92,252,0.14);color:var(--accent2);padding:1px 7px;border-radius:100px;font-size:10px;margin-left:5px">${v.comments.length}</span></button>
    </div>

    <div class="tab-content active" id="t-about">
      ${v.desc?`<p style="color:var(--text2);line-height:1.8;font-size:15px">${esc(v.desc)}</p>`:
      `<p style="color:var(--text3);font-size:14px;font-style:italic">Sem descrição.</p>`}
    </div>

    <div class="tab-content" id="t-tech">
      ${v.tech.length?`<div class="tech-grid">${v.tech.map((t,i)=>`
        <div class="tech-chip"><div class="tdot" style="background:${TC[i%TC.length]}"></div>${esc(t)}</div>
      `).join('')}</div>`:`<p style="color:var(--text3);font-size:14px;font-style:italic">Nenhuma tecnologia cadastrada.</p>`}
    </div>

    <div class="tab-content" id="t-comm">
      <div class="comment-form">
        <textarea class="comment-ta" id="new-comm" placeholder="Deixe um comentário..." maxlength="500" oninput="document.getElementById('comm-cc').textContent=this.value.length+'/500'"></textarea>
        <div class="cf-footer">
          <span class="cc" id="comm-cc">0/500</span>
          <button class="btn btn-primary btn-sm" onclick="postComment(${v.id})">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Comentar
          </button>
        </div>
      </div>
      <div class="comments-list" id="comm-list">${renderComments(v)}</div>
    </div>
  `;

  openModal('view-modal');
}

function renderComments(v) {
  if(!v.comments.length) return `<div class="no-comments">Nenhum comentário ainda. Seja o primeiro!</div>`;
  return v.comments.map(c=>`
    <div class="comment" id="c-${c.id}">
      <div class="cavatar" style="background:${c.color}22;color:${c.color}">${c.av}</div>
      <div style="flex:1">
        <div class="chead"><span class="cauthor">${esc(c.author)}</span><span class="cdate">${c.date}</span></div>
        <p class="ctext">${esc(c.text)}</p>
        <div class="cacts">
          <button class="cact ${c.liked?'liked':''}" onclick="likeComm(${v.id},${c.id})">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="${c.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${c.likes}
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

// ── Actions ────────────────────────────────────────────
function hoverS(id,n){document.querySelectorAll('.mstar').forEach((s,i)=>{s.className='mstar'+(i<n?' ':' off');});}
function resetS(id){const v=S.videos.find(x=>x.id===id);if(!v)return;document.querySelectorAll('.mstar').forEach((s,i)=>{s.className='mstar'+(i<v.rating?' ':' off');});}

function doRate(id, n) {
  const v = S.videos.find(x=>x.id===id);
  if(!v) return;
  v.rating = n;
  v.ratingCount = (v.ratingCount||0) + 1;
  save(); render();
  document.getElementById('rinfo').textContent = `${v.ratingCount} avaliação${v.ratingCount!==1?'ões':''} · Média ${v.rating.toFixed(1)}`;
  toast(`Avaliado com ${n} estrela${n!==1?'s':''}! ⭐`,'s');
}

function quickRate(id,n){doRate(id,n);}

function postComment(id) {
  const v = S.videos.find(x=>x.id===id);
  const txt = document.getElementById('new-comm').value.trim();
  if(!txt){toast('Escreva algo antes de comentar.','i');return;}
  const name = S.profile.name || 'Visitante';
  const av = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';
  v.comments.unshift({id:Date.now(),author:name,av,color:TC[Math.floor(Math.random()*TC.length)],text:txt,date:'agora mesmo',likes:0,liked:false});
  document.getElementById('new-comm').value='';
  document.getElementById('comm-cc').textContent='0/500';
  document.getElementById('comm-list').innerHTML=renderComments(v);
  save(); render(); toast('Comentário publicado!','s');
}

function likeComm(vid,cid){
  const v=S.videos.find(x=>x.id===vid);
  const c=v?.comments.find(x=>x.id===cid);
  if(!c)return;
  c.liked=!c.liked; c.likes+=c.liked?1:-1;
  document.getElementById('comm-list').innerHTML=renderComments(v);
  save();
}

function toggleLike(id, fromModal){
  const v=S.videos.find(x=>x.id===id);
  if(!v)return;
  v.liked=!v.liked; v.likes=(v.likes||0)+(v.liked?1:-1);
  save(); render();
  toast(v.liked?'Adicionado aos favoritos ❤️':'Removido dos favoritos','i');
  if(fromModal) openView(id);
}

function dlVideo(id){
  const v=S.videos.find(x=>x.id===id);
  closeDrops();
  if(v?.url){
    const a=document.createElement('a');
    a.href=v.url; a.download=v.title||'video'; a.target='_blank'; a.click();
  }
  toast(`📥 Iniciando download: ${v?.title||'vídeo'}...`,'s');
}

function flipPrivacy(id){
  const v=S.videos.find(x=>x.id===id);
  if(!v)return;
  v.privacy=v.privacy==='public'?'private':'public';
  closeDrops(); save(); render();
  toast(`Vídeo agora é ${v.privacy==='public'?'público':'privado'}.`,'s');
}

function delVideo(id){
  if(!confirm('Excluir este vídeo do portfólio?'))return;
  S.videos=S.videos.filter(v=>v.id!==id);
  closeDrops(); save(); render(); toast('Vídeo excluído.','i');
}

// ── Upload form ────────────────────────────────────────
function onFileChange(e){
  const f=e.target.files[0]; if(!f)return;
  document.getElementById('file-sel').style.display='flex';
  document.getElementById('file-name').textContent=f.name;
  const pw=document.getElementById('prog-wrap');
  const pf=document.getElementById('prog-fill');
  pw.style.display='block'; let w=0;
  const t=setInterval(()=>{w+=Math.random()*20; if(w>=100){w=100;clearInterval(t);} pf.style.width=w+'%';},80);
  // Store object URL for playback
  document.getElementById('f-url').value = URL.createObjectURL(f);
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('upzone').classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('video/')){
    document.getElementById('file-sel').style.display='flex';
    document.getElementById('file-name').textContent=f.name;
    document.getElementById('f-url').value=URL.createObjectURL(f);
  }
}

function setPriv(p){
  S.privSel=p;
  document.getElementById('btn-pub').className='pbtn'+(p==='public'?' ap':'');
  document.getElementById('btn-priv').className='pbtn'+(p==='private'?' av':'');
}

function tagKey(e){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const v=e.target.value.trim().replace(/,$/,'');
    if(v&&!S.tags.includes(v)){S.tags.push(v);renderTagPills();}
    e.target.value='';
  } else if(e.key==='Backspace'&&!e.target.value&&S.tags.length){
    S.tags.pop(); renderTagPills();
  }
}

function renderTagPills(){
  const b=document.getElementById('tags-box');
  const inp=document.getElementById('tag-in');
  b.innerHTML='';
  S.tags.forEach((t,i)=>{
    const p=document.createElement('div'); p.className='tpill';
    p.innerHTML=`${esc(t)}<span class="tremove" onclick="S.tags.splice(${i},1);renderTagPills()">×</span>`;
    b.appendChild(p);
  });
  b.appendChild(inp); inp.focus();
}

function saveVideo(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){toast('Adicione um título.','i');return;}
  const v={
    id:Date.now(), title,
    desc:document.getElementById('f-desc').value.trim(),
    tech:[...S.tags],
    duration:document.getElementById('f-dur').value.trim(),
    privacy:S.privSel,
    thumb:document.getElementById('f-thumb').value.trim(),
    url:document.getElementById('f-url').value.trim(),
    rating:0, ratingCount:0, views:0, likes:0, liked:false, comments:[]
  };
  S.videos.unshift(v);
  save(); render(); closeModal('up-modal'); resetForm();
  toast('Vídeo adicionado ao portfólio!','s');
}

function resetForm(){
  ['f-title','f-desc','f-dur','f-thumb','f-url'].forEach(id=>document.getElementById(id).value='');
  S.tags=[]; S.privSel='public'; setPriv('public');
  document.getElementById('file-sel').style.display='none';
  document.getElementById('prog-wrap').style.display='none';
  document.getElementById('prog-fill').style.width='0%';
  renderTagPills();
}

// ── Modals ─────────────────────────────────────────────
function openUpload(){openModal('up-modal');}
function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';}
function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
function bdClick(e,id){if(e.target.id===id)closeModal(id);}

// ── Tabs ───────────────────────────────────────────────
function swTab(e,tid){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(tid).classList.add('active');
}

// ── Filter ─────────────────────────────────────────────
function setFilter(f,btn){
  S.filter=f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── Dropdowns ──────────────────────────────────────────
function toggleDrop(id){
  const d=document.getElementById('drop-'+id);
  const open=d.classList.contains('open');
  closeDrops();
  if(!open)d.classList.add('open');
}
function closeDrops(){document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('open'));}
document.addEventListener('click',closeDrops);

// ── Toast ──────────────────────────────────────────────
let tt;
function toast(msg,type='s'){
  const el=document.getElementById('toast');
  const ic=document.getElementById('ti');
  document.getElementById('tm').textContent=msg;
  el.className=`toast t${type} show`;
  ic.innerHTML=type==='s'
    ?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
    :'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),3500);
}

// ── Utils ──────────────────────────────────────────────
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// ── Keyboard ───────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal('view-modal');closeModal('up-modal');}
});

// ── Init ───────────────────────────────────────────────
initProfile();
render();
</script>
</body>
</html>
